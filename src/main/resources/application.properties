spring.application.name=taskflow-api

# Module 4: Railway (and most hosts) inject PORT at runtime; fall back to 8080 locally.
server.port=${PORT:8080}

# Task 6: the OpenAI key is read from the OPENAI_API_KEY environment variable.
# Never put the real key in this file. The "not-set" fallback lets the app start
# without a key so that every endpoint except /api/tasks/summary still works.
spring.ai.openai.api-key=${OPENAI_API_KEY:not-set}
