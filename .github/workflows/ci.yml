name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and package
        run: mvn -B -DskipTests package
      - uses: actions/upload-artifact@v4
        with:
          name: taskflow-api-jar
          path: target/*.jar

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run tests
        run: mvn -B test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: target/surefire-reports

  publish:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip if Docker Hub secrets are not set
        if: env.DOCKER_USERNAME == '' || env.DOCKER_TOKEN == ''
        run: echo "DOCKER_USERNAME / DOCKER_TOKEN repo secrets are not set, skipping publish"
      - uses: docker/login-action@v3
        if: env.DOCKER_USERNAME != '' && env.DOCKER_TOKEN != ''
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_TOKEN }}
      - uses: docker/build-push-action@v6
        if: env.DOCKER_USERNAME != '' && env.DOCKER_TOKEN != ''
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/taskflow-api:latest
            ${{ env.DOCKER_USERNAME }}/taskflow-api:${{ github.sha }}
